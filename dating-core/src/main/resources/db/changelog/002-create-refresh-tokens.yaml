# TODO(perf): нет индексов refresh_tokens(user_id, revoked) и (expires_at) — reuse-detection
#  (findAllByUserIdAndRevokedFalse) и ночная чистка идут seq scan'ом по всей таблице.
#  Оценка роста: access-ttl 15 мин + ротация на каждый refresh ~ 96 строк на юзера в сутки,
#  живут 30 дней.
databaseChangeLog:
  - changeSet:
      id: 002-create-refresh-tokens
      author: dating
      changes:
        - createTable:
            tableName: refresh_tokens
            columns:
              - column: {name: id, type: UUID, constraints: { primaryKey: true, nullable: false } }
              - column: {name: user_id, type: UUID, constraints: { nullable: false } }
              - column: {name: token_hash, type: VARCHAR(255), constraints: { unique: true, nullable: false } }
              - column: {name: expires_at, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
              - column: {name: revoked, type: BOOLEAN, constraints: { nullable: false } }
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
              - column: {name: updated_at, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableName: refresh_tokens
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_refresh_user



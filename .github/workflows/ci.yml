# CI-пайплайн для всех модулей репозитория (GitHub Actions).
# Лежит в КОРНЕ репозитория: .github/workflows/ci.yml
# Срабатывает на каждый push в master и на каждый pull request в master.
name: CI

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master ]

# Если в ту же ветку/PR прилетел новый коммит — отменяем предыдущий запуск,
# чтобы не гонять устаревшую сборку и не жечь минуты.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Принцип наименьших привилегий: по умолчанию только чтение репозитория.
permissions:
  contents: read

# TODO(ci): нет сверки двух копий profile.proto (core и matching) — расхождение контракта не
#  ловится ничем до рантайма; обе копии к тому же генерят классы в ОДИН пакет com.dating.core.*.
#  Шаг diff, билд падает при различии. День +1 добавит вторую пару (matching.proto).
# TODO(ci): покрытие не измеряется — jacoco нет ни в одном pom, деградацию тестов не видно.
# TODO(ci): нет timeout-minutes — зависший Testcontainers держит джобу до дефолтных 6 часов.
# TODO(ci): образ пересобирается внутри Dockerfile с -DskipTests => публикуется артефакт, который
#  не тестировался. Собирать jar в build-test и передавать артефактом в docker-image.
# TODO(ci): cache: maven даёт один ключ на все 4 элемента матрицы — задать cache-dependency-path.
# TODO(ci): if-no-files-found: ignore на выгрузке отчётов — "тестов не было" выглядит как "всё зелено".
# TODO(ci): нет сквозной e2e-джобы (compose up -> register -> взаимный лайк -> уведомление);
#  единственный сценарий лежит в e2e-test.ps1, который под .gitignore и требует Windows.
# TODO(ci): нет проверки единой версии spring-boot-starter-parent (api-gateway отстал на 4.0.7).
# TODO(ci): mockito javaagent прописан в surefire только в dating-core, а Mockito используется
#  ещё в matching и notification (JDK 25 ругается на динамическую подгрузку агента).
# TODO(ci): комментарий в шапке говорит только про master, а push-триггер включает develop.
jobs:
  # ---------- Джоба 1: сборка + тесты (каждый модуль — отдельный запуск матрицы) ----------
  build-test:
    name: Build & Test ${{ matrix.module }} (JDK 25)
    runs-on: ubuntu-latest              # GitHub-раннер; в нём УЖЕ есть Docker (нужно Testcontainers)
    strategy:
      fail-fast: false                  # падение одного модуля не отменяет сборку второго
      matrix:
        module: [ dating-core, api-gateway, matching, notification ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven                  # кешируем ~/.m2 между запусками → сборка быстрее

      - name: Build and run tests
        working-directory: ${{ matrix.module }}
        run: |
          chmod +x mvnw                 # на Windows исполняемый бит часто теряется — выставляем
          ./mvnw -B -ntp verify         # компиляция + все тесты (вкл. Testcontainers) + упаковка jar

      - name: Upload test reports
        if: always()                    # выкладываем отчёты, даже если тесты упали
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.module }}
          path: ${{ matrix.module }}/target/surefire-reports/
          if-no-files-found: ignore

  # ---------- Джоба 2: сборка и публикация Docker-образов (CD-lite) ----------
  # Идёт только после зелёной build-test и только на push в master (не на PR).
  # Имя образа включает модуль (ghcr.io/<repo>/<module>), иначе образы
  # dating-core и api-gateway перезаписывали бы друг друга под одним тегом.
  docker-image:
    name: Build & push ${{ matrix.module }} image (ghcr.io)
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    strategy:
      # TODO(ci): Dockerfile есть у ВСЕХ четырёх модулей — этот TODO протух. matching и
      #  notification в матрицу не добавлены: их образы никогда не публикуются, а сборка их
      #  Dockerfile не проверяется вообще ничем.
      matrix:
        module: [ dating-core, api-gateway ]
    permissions:
      contents: read
      packages: write                   # право пушить образ в GitHub Container Registry
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # выдаётся автоматически, свой секрет не нужен

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.module }} # тут лежат Dockerfile, pom.xml, src
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.module }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.module }}:${{ github.sha }}

server:
  port: 8088

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: coreRoute
              uri: ${CORE_URI:http://localhost:8081}
              predicates:
                - Path=/api/profiles/**,/api/auth/**,/api/matching/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter:
                      replenishRate: 10
                      burstCapacity: 20
                      requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: coreCircuitBreaker
                    fallbackUri: forward:/fallback/core
            - id: matchingRoute
              uri: ${MATCHING_URI:http://localhost:8083}
              predicates:
                - Path=/api/recommendations/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter:
                      replenishRate: 10
                      burstCapacity: 20
                      requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: matchingCircuitBreaker
                    fallbackUri: forward:/fallback/matching

  data:
    redis:
      port: ${REDIS_PORT:6379}
      host: ${REDIS_HOST:localhost}

resilience4j:
  circuitbreaker:
    instances:
      coreCircuitBreaker:
        failureRateThreshold: 50
        slowCallRateThreshold: 100
        slowCallDurationThreshold: 2000ms
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: 60s
#      пока что копия core, сделано для индивидуальной настройки в будущем
      matchingCircuitBreaker:
        failureRateThreshold: 50
        slowCallRateThreshold: 100
        slowCallDurationThreshold: 2000ms
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: 60s
        
  timelimiter:
    instances:
      coreCircuitBreaker:
        timeoutDuration: 3s
      matchingCircuitBreaker:
        timeout-duration: 3s

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          # TODO(security): /actuator/gateway доступен любому аутентифицированному пользователю
          #  (в permitAll только /actuator/health) — наружу уезжает карта маршрутов с внутренними URI.
          #  ПРОВЕРИТЬ, доступны ли в Spring Cloud Gateway 2025.1.x пишущие операции этого эндпоинта
          #  (POST/DELETE /actuator/gateway/routes): если да — это подмена маршрута, а не разведка.
          - gateway

# TODO(ops): CORS не настроен нигде — preflight OPTIONS идёт без Authorization и упирается
#  в anyExchange().authenticated() -> 401. Браузерный клиент не заработает вообще.
# TODO(security): нет фильтра RemoveRequestHeader — если identity будут прокидывать заголовком
#  (X-User-Id для matching), клиентский заголовок пройдёт насквозь и IDOR останется.
# TODO(ops): нет graceful shutdown и метрик.
# TODO(debt): timeoutDuration / timeout-duration записаны по-разному в двух инстансах TimeLimiter —
#  работает благодаря relaxed binding, но стоит привести к одному виду.
app:
  jwt:
    # TODO(security): дефолтный секрет как fallback — см. такой же TODO в dating-core.
    secret: ${JWT_SECRET:change-me-in-prod-use-at-least-32-bytes-secret-key}